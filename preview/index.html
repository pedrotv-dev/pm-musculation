<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f12">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="PM Musculation — entraînements de Pierre et Manon.">
  <!-- Aucun script ni style en ligne : tout vient de fichiers locaux (hors ligne, sécurité). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PM Muscu">
  <title>PM Musculation</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/apercu.css">
  <link rel="stylesheet" href="./css/programs.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/workout.css">
  <link rel="stylesheet" href="./css/rest.css">
  <link rel="stylesheet" href="./css/jeu.css">
  <link rel="stylesheet" href="./css/succes.css">
  <link rel="stylesheet" href="./css/effets.css">
</head>
<body>
  <!-- Icônes : sprite local assets/ascent/icones.svg (précaché, aucun téléchargement externe). -->
  <div class="app" id="app">
    <header class="header">
      <div class="brand">
        <img class="brand-logo" src="./assets/icons/icon-192.png" alt="" width="47" height="47"> <!-- même fichier que l'icône de l'application : remplacer assets/icons/* met à jour les deux -->
        <div><h1 class="brand-name">PM Musculation</h1><span class="brand-sub">Pierre &amp; Manon</span></div>
      </div>
      <button type="button" class="profile-switch" id="switch-profile" hidden>Changer de profil</button>
    </header>

    <main id="main-content">
      <section id="screen-select" aria-labelledby="select-title">
        <div class="eyebrow">Bienvenue</div>
        <h2 id="select-title">Choisis ton profil</h2>
        <p class="description">Ton choix sera mémorisé sur cet appareil. Tu pourras changer de profil plus tard.</p>
        <div class="choice-grid">
          <button type="button" class="choice pierre" data-select-profile="pierre"><span class="initial">P</span><strong>Pierre</strong><span>Prise de muscle</span></button>
          <button type="button" class="choice manon" data-select-profile="manon"><span class="initial">M</span><strong>Manon</strong><span>Renforcement</span></button>
        </div>
        <!-- Profils créés sur cet appareil (registre IndexedDB) et création d'un profil local : rempli par js/app.js -->
        <div class="choice-grid" id="user-profiles" hidden></div>
        <button type="button" class="secondary pm-create-profile" id="create-profile">+ Créer un profil</button>
        <form class="pm-create-form" id="create-profile-form" hidden novalidate>
          <label class="pm-create-label" for="new-profile-name">Prénom ou pseudo</label>
          <input class="pm-input" id="new-profile-name" name="name" type="text" maxlength="40" autocomplete="off" autocapitalize="words" enterkeyhint="done">
          <p class="pm-create-error" id="create-profile-error" role="alert" hidden></p>
          <div class="pm-create-actions">
            <button type="button" class="secondary" id="create-profile-cancel">Annuler</button>
            <button type="submit" class="primary" id="create-profile-submit">Créer</button>
          </div>
          <p class="pm-create-note">Le profil reste sur ce téléphone : aucun compte, aucun e-mail.</p>
        </form>
        <button type="button" class="secondary pm-create-profile" id="import-profile">Importer un profil (fichier de sauvegarde)</button>
        <input type="file" id="import-profile-file" accept=".json,application/json" hidden aria-label="Fichier de sauvegarde d’un profil">
        <p class="pm-create-error" id="import-profile-status" role="status" hidden></p>
        <button type="button" class="choice demo" data-select-profile="demo"><span class="initial" aria-hidden="true">▶</span><span class="demo-copy"><strong>Explorer la démo</strong><span>Exemples de programmes, séances et progrès · données fictives</span></span></button>
        <p class="footnote">Aucun compte à créer. La démo ne modifie pas vos historiques.</p>
      </section>

      <!-- Les pages sont remplies par js/home-ui.js, program-ui.js, history-ui.js, progress-ui.js et profile-ui.js -->
      <div id="app-pages" hidden>
        <!-- onglet « Séances » : deux sous-pages, Programme et Historique -->
        <div class="pm-seances-tabs" id="seances-tabs" role="group" aria-label="Séances" hidden>
          <button type="button" class="pm-subtab" data-go="programme">Programme</button>
          <button type="button" class="pm-subtab" data-go="historique">Historique</button>
        </div>
        <section class="page" data-page="accueil" aria-label="Accueil"></section>
        <section class="page" data-page="programme" aria-label="Programme" hidden></section>
        <section class="page" data-page="historique" aria-label="Historique" hidden></section>
        <section class="page" data-page="progres" aria-label="Progrès" hidden></section>
        <section class="page" data-page="profil" aria-label="Profil" hidden></section>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation principale" hidden>
    <div class="bottom-nav-inner">
      <button type="button" class="nav-btn active" data-go="accueil" aria-current="page"><svg aria-hidden="true"><use href="assets/ascent/icones.svg#ico-accueil"/></svg>Accueil</button>
      <button type="button" class="nav-btn" data-go="seances"><svg aria-hidden="true"><use href="assets/ascent/icones.svg#ico-seances"/></svg>Séances</button>
      <button type="button" class="nav-btn" data-go="progres"><svg aria-hidden="true"><use href="assets/ascent/icones.svg#ico-progression"/></svg>Progression</button>
      <button type="button" class="nav-btn" data-go="profil"><svg aria-hidden="true"><use href="assets/ascent/icones.svg#ico-profil"/></svg>Profil</button>
    </div>
  </nav>

  <!-- app.js doit rester le premier module : il fixe le profil actif avant les autres. -->
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/program-ui.js"></script>
  <script type="module" src="./js/home-ui.js"></script>
  <script type="module" src="./js/workout-ui.js"></script>
  <script type="module" src="./js/history-ui.js"></script>
  <script type="module" src="./js/progress-ui.js"></script>
  <script type="module" src="./js/profile-ui.js"></script>
  <script type="module" src="./js/rest-ui.js"></script>
  <script type="module" src="./js/nav-history.js"></script>
  <script type="module" src="./js/effets.js"></script>
  <script type="module" src="./js/sfx.js"></script>
  <script type="module" src="./js/sons.js"></script>
</body>
</html>
